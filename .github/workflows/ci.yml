name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      FEEDBACK_HASH_SALT: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # banco descartável: aplica todas as migrations do zero + seed local
      - run: supabase start -x studio,realtime,edge-runtime,logflare,vector,imgproxy,supavisor
      - name: Variáveis do Supabase local
        run: |
          supabase status -o env > .supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' .supabase.env | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep '^PUBLISHABLE_KEY=' .supabase.env | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "SUPABASE_SECRET_KEY=$(grep '^SECRET_KEY=' .supabase.env | cut -d= -f2- | tr -d '\"')" >> .env.local
          cat .env.local | cut -d= -f1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
